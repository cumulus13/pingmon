# Pingmon Configuration File (INI format)
# Place this file in one of these locations:
# Windows:
#   - %USERPROFILE%\.pingmon\pingmon.ini
#   - %APPDATA%\.pingmon\pingmon.ini
# Linux/macOS:
#   - ~/.pingmon/pingmon.ini
#   - ~/.config/.pingmon/pingmon.ini
#   - ~/.config/pingmon.ini

# Timeout threshold in seconds before sending Growl notification
# Default: 60 (1 minute)
pingmon_timeout=60
